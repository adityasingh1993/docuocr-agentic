schema_version: "1.0"
artifact_root: artifacts
offline: true

policy:
  accept_threshold: 0.90
  document_quality_threshold: 0.90
  max_document_enhancements: 1
  max_enhancement_variants: 3
  enhancement_min_ocr_gain: 0.02
  enhancement_min_text_retention: 0.80
  enhancement_min_control_retention: 0.75
  max_field_retries: 2
  review_mode: queue

paddle:
  enabled: false
  text_enabled: true
  layout_enabled: false
  engine: paddle
  device: cpu
  language: en
  layout_model_dir: C:/paddle_models/PP-DocLayoutV3_safetensors
  vl_rec_model_dir: C:/paddle_models/PaddleOCR-VL-1.6
  text_detection_model_dir: C:/paddle_models/PP-OCRv6_medium_det
  text_recognition_model_dir: C:/paddle_models/PP-OCRv6_medium_rec
  layout_threshold: 0.30
  text_detection_threshold: 0.20
  text_box_threshold: 0.40
  text_recognition_threshold: 0.00

vlm:
  enabled: false
  base_url: http://127.0.0.1:8081/v1
  model: Qwen/Qwen3-VL-4B-Instruct-GGUF:Q4_K_M
  api_key: local-only
  timeout_seconds: 120
  max_tokens: 2048
  document_understanding_enabled: true
  understanding_max_tokens: 1024
  max_understanding_ocr_spans: 80
  max_paths_per_request: 4
  max_controls_per_request: 32
  request_retries: 1
  allow_private_lan: false

trace:
  include_values: false
  save_crops: true
  save_layout_images: true
