schema_version: "1.0"
artifact_root: artifacts
offline: true

policy:
  accept_threshold: 0.90
  document_quality_threshold: 0.90
  max_document_enhancements: 1
  max_field_retries: 2
  review_mode: queue

paddle:
  enabled: false
  engine: transformers
  device: gpu:0
  language: en
  layout_model_dir: C:/paddle_models/PP-DocLayoutV3_safetensors
  vl_rec_model_dir: C:/paddle_models/PaddleOCR-VL-1.6
  text_detection_model_dir: C:/paddle_models/PP-OCRv6_medium_det
  text_recognition_model_dir: C:/paddle_models/PP-OCRv6_medium_rec
  layout_threshold: 0.30
  text_detection_threshold: 0.20
  text_box_threshold: 0.40
  text_recognition_threshold: 0.00

vlm:
  enabled: false
  base_url: http://127.0.0.1:8081/v1
  model: Qwen/Qwen3-VL-4B-Instruct-GGUF:Q4_K_M
  api_key: local-only
  timeout_seconds: 120
  max_tokens: 1200
  allow_private_lan: false

trace:
  include_values: false
  save_crops: true

