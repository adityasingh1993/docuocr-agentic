[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "docuocr-agentic"
version = "0.2.0"
description = "Private, evidence-grounded, agentic form extraction with PaddleOCR, OpenCV, local VLMs, LangGraph, and Pydantic."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.32,<1",
]
paddle = [
  "paddleocr[doc-parser]>=3.5,<4",
  "paddlepaddle>=3.3,<4",
]
paddle-transformers = [
  "paddleocr[doc-parser]>=3.5,<4",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=5.10,<6",
]
paddle-native = [
  "paddleocr[doc-parser]>=3.5,<4",
  "paddlepaddle>=3.3,<4",
]
paddle-onnx = [
  "onnxruntime>=1.20,<2",
  "paddleocr[doc-parser]>=3.5,<4",
]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
docuocr = "docuocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docuocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
